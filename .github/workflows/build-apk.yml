name: Build SAMRAT APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Unzipping $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          rm "$ZIP_FILE"
          PROJ_DIR=$(find extracted -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project dir: $PROJ_DIR"
          shopt -s dotglob
          mv "$PROJ_DIR"/* .
          rm -rf extracted
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Fix Android V2 embedding
        run: |
          rm -rf android
          flutter create --org com.samrat --project-name samrat_pay_alert .
          flutter pub add flutter_tts:^4.0.2
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMRAT-Pay-Alert-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
