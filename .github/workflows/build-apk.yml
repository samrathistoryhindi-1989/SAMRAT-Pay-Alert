name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Found: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          rm "$ZIP_FILE"
          PROJ_DIR=$(find extracted -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project dir: $PROJ_DIR"
          shopt -s dotglob
          mv "$PROJ_DIR"/* .
          rm -rf extracted
          ls -la
          ls -la android/app/ || echo "no android folder yet"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android SDK (Manual)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Fix Android Build for SDK 35
        run: |
          if [ ! -f android/app/build.gradle ]; then
            echo "android folder missing, creating with flutter create"
            flutter create --org com.samrat --project-name samrat_pay_alert --no-pub .
          fi
          sed -i -E 's/compileSdk(Version)?[[:space:]]+[0-9]+/compileSdkVersion 35/' android/app/build.gradle || true
          grep -n compileSdk android/app/build.gradle || true
          sed -i 's/flutter_tts:.*/flutter_tts: ^4.2.2/' pubspec.yaml || true
          flutter pub get
      - name: Fix Android Build for SDK 35
        run: |
          if [ ! -f android/app/build.gradle ]; then
            flutter create --org com.samrat --project-name samrat_pay_alert --no-pub .
          fi
          sed -i -E 's/compileSdk(Version)?[[:space:]]+[0-9]+/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/flutter_tts:.*/flutter_tts: ^4.2.2/' pubspec.yaml || true
          # setAudioAttributes method లేదు కాబట్టి ఆ line ని తీసెయ్యి
          sed -i '/setAudioAttributes/d' lib/services/tts_service.dart
          grep -n "setAudioAttributes" lib/services/tts_service.dart || echo "patched - method removed"
          flutter pub get
          
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMRAT-Pay-Alert-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
