          for manifest in glob.glob("**/AndroidManifest.xml", recursive=True):
              print("Patching", manifest)
              with open(manifest) as f:
                  txt=f.read()
              if "flutterEmbedding" not in txt:
                  txt=txt.replace("</application>", '        <meta-data android:name="flutterEmbedding" android:value="2" />\n    </application>')
                  open(manifest,"w").write(txt)
