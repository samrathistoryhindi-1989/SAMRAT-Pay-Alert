name: Build SAMRAT APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Unzipping $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted
          rm "$ZIP_FILE"
          PROJ_DIR=$(find extracted -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Project dir: $PROJ_DIR"
          shopt -s dotglob
          mv "$PROJ_DIR"/* .
          rm -rf extracted
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter latest
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Android V2 + SDK 35
        run: |
          rm -rf android
          flutter create --org com.samrat --project-name samrat_pay_alert --no-pub .
          # flutter_tts latest (setAudioAttributes కోసం)
          sed -i 's/flutter_tts:.*/flutter_tts: ^4.2.2/' pubspec.yaml
          # audioplayers_android కోసం compileSdk 35
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 35/' android/app/build.gradle
          grep -n "flutter_tts" pubspec.yaml
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMRAT-Pay-Alert-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
