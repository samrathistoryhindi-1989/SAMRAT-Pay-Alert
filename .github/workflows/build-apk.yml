name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android SDK (Manual)
        run: |
          # 1. Android SDK కమాండ్ లైన్ టూల్స్ డౌన్‌లోడ్ చేయండి
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip
          
          # 2. పాత్ (PATH) సెట్ చేయండి
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # 3. లైసెన్స్ అంగీకరించి, SDK 35 ఇన్‌స్టాల్ చేయండి
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Fix Android Build for SDK 35
        run: |
          sed -i -E 's/(compileSdk)(Version)?[[:space:]]+[0-9]+/\1\2 35/' android/app/build.gradle
          sed -i -E 's/(targetSdk)(Version)?[[:space:]]+[0-9]+/\1\2 35/' android/app/build.gradle
          sed -i -E 's/(minSdk)(Version)?[[:space:]]+[0-9]+/\1\2 21/' android/app/build.gradle
          sed -i 's/sourceCompatibility .*/sourceCompatibility JavaVersion.VERSION_17/' android/app/build.gradle
          sed -i 's/targetCompatibility .*/targetCompatibility JavaVersion.VERSION_17/' android/app/build.gradle
          sed -i 's/id "com.android.application" version .*/id "com.android.application" version "8.1.0" apply false/' android/settings.gradle
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
