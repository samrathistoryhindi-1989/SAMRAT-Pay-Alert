name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android SDK 35
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Fix Android Build for SDK 35
        run: |
          sed -i -E 's/(compileSdk)(Version)?[[:space:]]+[0-9]+/\1\2 35/' android/app/build.gradle
          sed -i -E 's/(targetSdk)(Version)?[[:space:]]+[0-9]+/\1\2 35/' android/app/build.gradle
          sed -i -E 's/(minSdk)(Version)?[[:space:]]+[0-9]+/\1\2 21/' android/app/build.gradle
          sed -i 's/sourceCompatibility .*/sourceCompatibility JavaVersion.VERSION_17/' android/app/build.gradle
          sed -i 's/targetCompatibility .*/targetCompatibility JavaVersion.VERSION_17/' android/app/build.gradle
          sed -i 's/id "com.android.application" version .*/id "com.android.application" version "8.1.0" apply false/' android/settings.gradle
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
